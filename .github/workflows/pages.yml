name: Build Chronicle Memory showcase

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            admin/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm run generate
        working-directory: frontend
        env:
          NUXT_APP_BASE_URL: /${{ github.event.repository.name }}/chronicle-memory/
          NUXT_PUBLIC_API_BASE: ''
      - run: pnpm install --frozen-lockfile
        working-directory: admin
      - run: pnpm run generate
        working-directory: admin
        env:
          NUXT_APP_BASE_URL: /${{ github.event.repository.name }}/admin/
          NUXT_PUBLIC_API_BASE: ''
      - run: |
          mkdir -p site/chronicle-memory site/admin
          cp -R landing/. site/
          cp -R frontend/.output/public/. site/chronicle-memory/
          cp -R admin/.output/public/. site/admin/
          printf 'Chronicle Memory public offline showcase\n' > site/chronicle-memory/SHOWCASE-MODE.txt
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
